name: Update Scholar Citations

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "get_scholar_stats.py"
      - "scholar_citations.json"
      - ".github/workflows/update-scholar-citations.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly

      - name: Generate scholar_citations.json
        run: |
          python get_scholar_stats.py --out scholar_citations.json --pretty

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- scholar_citations.json; then
            echo "No changes to scholar_citations.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar_citations.json
          git commit -m "chore: update scholar_citations.json"
          git push
